<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicote & Ponto | Willys AP Pro</title>
  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #111827;
      --table-border: #1f293d;
      --accent-yellow: #f59e0b;
      --accent-green: #059669;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 40px;
    }

    /* Cabeçalho */
    .header {
      margin-bottom: 12px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-yellow);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    /* Barra de Ações Rápidas */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ecu-switch {
      display: flex;
      background: #1e293b;
      border-radius: 9999px;
      padding: 2px;
      margin-left: 4px;
    }

    .ecu-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
    }

    .ecu-btn.active {
      background: var(--accent-yellow);
      color: #000;
    }

    /* Abas do Menu */
    .tabs-bar {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid #1f2937;
      margin-top: 16px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .tab-item {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      padding-bottom: 6px;
    }

    .tab-item.active {
      color: var(--accent-yellow);
      border-bottom: 2px solid var(--accent-yellow);
    }

    /* Caixa de Busca */
    .search-section {
      margin-top: 18px;
    }

    .search-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .search-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-yellow);
    }

    .badge-status {
      background-color: var(--accent-green);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1.2;
      text-align: center;
    }

    .input-search {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--accent-yellow);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .input-search::placeholder {
      color: #64748b;
    }

    /* Tabela com Check Box */
    .table-container {
      margin-top: 16px;
      background: #0d1527;
      border: 1px solid var(--table-border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      padding: 14px 10px;
      border-bottom: 1px solid var(--table-border);
    }

    td {
      padding: 14px 10px;
      border-bottom: 1px solid #162035;
      color: #cbd5e1;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Estilo do Checkbox */
    .check-cell {
      text-align: center;
      width: 44px;
    }

    .item-checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-yellow);
      cursor: pointer;
    }

    /* Efeito visual quando marcado */
    tr.checked td:not(.check-cell) {
      opacity: 0.45;
      text-decoration: line-through;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho Principal -->
  <div class="header">
    <div class="header-title">
      ⚡ CHICOTE & PONTO | WILLYS AP PRO
    </div>
    <div class="header-subtitle">Manual de Bancada e Campo 1AVB & 1AVP</div>

    <div class="top-actions">
      <button class="btn-action">💡 Luz/Tela</button>
      <button class="btn-action">🔊 Bip</button>
      
      <div class="ecu-switch">
        <button id="btn1AVB" class="ecu-btn active" onclick="selecionarECU('1AVB')">1AVB</button>
        <button id="btn1AVP" class="ecu-btn" onclick="selecionarECU('1AVP')">1AVP</button>
      </div>
    </div>
  </div>

  <!-- Navegação de Abas -->
  <div class="tabs-bar">
    <div class="tab-item active">🔍 Busca Fios</div>
    <div class="tab-item">🧮 Multímetro</div>
    <div class="tab-item">📷 Câmera Plug</div>
    <div class="tab-item">📐 Desenho</div>
  </div>

  <!-- Campo de Busca -->
  <div class="search-section">
    <div class="search-header">
      <div class="search-title">🔍 Localizador Rápido de Fios e Pinos</div>
      <div class="badge-status">Filtro<br>Imediato</div>
    </div>
    <input 
      type="text" 
      id="inputBusca" 
      class="input-search" 
      placeholder="Digite a cor (ex: marrom, azul) ou o pino..."
      oninput="filtrarTabela()"
    >
  </div>

  <!-- Tabela de Pinagem com Coluna de Checkbox -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="check-cell">✓</th>
          <th>Função</th>
          <th>Cor Original</th>
          <th>Bitola</th>
          <th>Destino</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        <!-- Linhas geradas via JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // Base de dados completa da pinagem 1AVB e 1AVP
    const dadosChicote = [
      { ecu: "1AVB", funcao: "Massa de Potência", cor: "Marrom", bitola: "1.5 mm²", destino: "Bloco / Cabeçote" },
      { ecu: "1AVB", funcao: "Relé da Bomba", cor: "Vermelho/Amarelo", bitola: "0.75 mm²", destino: "Pino 85 do Relé 2" },
      { ecu: "1AVB", funcao: "+5V Referência", cor: "Vermelho/Branco", bitola: "0.50 mm²", destino: "Alimentação MAP e TPS" },
      { ecu: "1AVB", funcao: "Injetores 1 e 4", cor: "Marrom/Branco", bitola: "1.0 mm²", destino: "Pulso negativo par 1-4" },
      { ecu: "1AVB", funcao: "Sensor CTS", cor: "Azul/Branco", bitola: "0.50 mm²", destino: "Temp. Água (Sensor Azul)" },
      { ecu: "1AVB", funcao: "Massa Sensores", cor: "Marrom/Azul", bitola: "0.50 mm²", destino: "Massa de sinal MAP e TPS" },
      { ecu: "1AVB", funcao: "Sinal MAP", cor: "Amarelo/Verde", bitola: "0.50 mm²", destino: "Retorno Pressão Coletor" },
      { ecu: "1AVP", funcao: "Sinal Bobina Pino 1", cor: "Cinza/Preto", bitola: "0.75 mm²", destino: "Transformador Ignição" },
      { ecu: "1AVP", funcao: "Linha 30 (Bateria)", cor: "Vermelho", bitola: "1.5 mm²", destino: "Fusível 15A Direto" }
    ];

    let ecuAtiva = "1AVB";

    function selecionarECU(tipo) {
      ecuAtiva = tipo;
      document.getElementById('btn1AVB').classList.toggle('active', tipo === '1AVB');
      document.getElementById('btn1AVP').classList.toggle('active', tipo === '1AVP');
      filtrarTabela();
    }

    function toggleCheck(checkbox) {
      const row = checkbox.closest('tr');
      if (checkbox.checked) {
        row.classList.add('checked');
      } else {
        row.classList.remove('checked');
      }
    }

    function renderizarTabela(itens) {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '';

      if (itens.length === 0) {
        corpo.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 20px;">Nenhum fio encontrado.</td></tr>`;
        return;
      }

      itens.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="check-cell">
            <input type="checkbox" id="check_${index}" class="item-checkbox" onchange="toggleCheck(this)">
          </td>
          <td><strong>${item.funcao}</strong></td>
          <td>${item.cor}</td>
          <td>${item.bitola}</td>
          <td>${item.destino}</td>
        `;
        corpo.appendChild(tr);
      });
    }

    function filtrarTabela() {
      const termo = document.getElementById('inputBusca').value.toLowerCase().trim();
      
      const filtrados = dadosChicote.filter(item => {
        const pertenceECU = (item.ecu === ecuAtiva);
        const bateTermo = termo === '' || 
          item.funcao.toLowerCase().includes(termo) ||
          item.cor.toLowerCase().includes(termo) ||
          item.destino.toLowerCase().includes(termo);
        
        return pertenceECU && bateTermo;
      });

      renderizarTabela(filtrados);
    }

    // Inicializar na carga da página
    window.onload = () => {
      filtrarTabela();
    };
  </script>
</body>
</html>
